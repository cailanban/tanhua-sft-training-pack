# LLaMA-Factory QLoRA 配置（RTX 5090 32G 性价比档）
# 用法：llamafactory-cli train qlora_27b_5090.yaml
# 前置：数据盘扩容 ≥120G（bf16 权重 54G + 数据 + 缓存）；镜像 CUDA≥12.8（Blackwell）
# 上机纪律：先 10 步 dry-run；OOM 按序降级：cutoff 16384→12288→8192，再不行换 80G 卡。
model_name_or_path: /root/autodl-tmp/Qwen3-27B   # 换成实际 27B 级 Qwen 权重路径
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
quantization_bit: 4
quantization_method: bnb
template: qwen3
enable_thinking: false        # 关键：金标无 think 块
dataset: tanhua_sft_train
eval_dataset: tanhua_sft_valid
dataset_dir: .
cutoff_len: 16384             # 32G 显存上限；32K 在此卡必 OOM
preprocessing_num_workers: 16
overwrite_cache: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
optim: paged_adamw_8bit       # 32G 显存必开：优化器状态换页，省 2-3G
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.1
num_train_epochs: 2
logging_steps: 10
save_steps: 500
eval_strategy: steps
eval_steps: 500
bf16: true
flash_attn: fa2
output_dir: saves/qwen3-27b/qlora-tanhua-5090
report_to: tensorboard
